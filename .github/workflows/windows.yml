# Builds the optimizers from source on a Windows runner with build-windows.ps1,
# then packages the app around them and checks the packaged app works.
#
# Runs only when the Windows code or an optimizer's source changes, not on
# every push. The from-source build compiles MozJPEG, libpng, Guetzli, libwebp,
# AOM, libavif and three Rust crates, and Windows runners bill at twice the
# rate of Linux ones; a build whose sources are unchanged reuses the last one.
#
# Pushing a tag v<version> also publishes the result as a GitHub Release, which
# is what the app's built-in updater reads (see the release job at the end).
#
# Actions are pinned to the commit behind their tag, so a moved tag cannot
# change what runs here; Dependabot proposes the updates.

name: Windows build

# Read-only unless a job says otherwise; only the release job writes.
permissions:
  contents: read

# A newer push supersedes an older run rather than both compiling in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    # GitHub does not apply the paths filter below to tag pushes, so every
    # version tag builds.
    tags: ['v*']
    paths:
      - 'build-windows.ps1'
      - 'win/**'
      - '.github/workflows/windows.yml'
      # The optimizers' own sources: an update to one used to be built for
      # the first time when a release was tagged
      - 'advpng/**'
      - 'aom/**'
      - 'gifsicle/**'
      - 'guetzli/**'
      - 'jpegoptim/**'
      - 'libavif/**'
      - 'libjpeg/**'
      - 'libpng/**'
      - 'libwebp/**'
      - 'oxipng/**'
      - 'pngcrush/**'
      - 'pngquant/**'
      - 'svgcleaner/**'
      - 'svgo/**'
      - 'zlib/**'
      - 'zopfli-png/**'
      # Documentation changes should not start a Windows runner
      - '!win/**.md'

jobs:
  optimizers:
    name: Build optimizers from source
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before ninety minutes of compiling rather than after: the updater
      # compares versions from latest.yml, which comes from package.json, so a
      # tag that disagrees with it would publish a release under the wrong name.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content win/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in win/package.json"
          }

      # Optimizers built from exactly these sources and this script, by an
      # earlier run. A release is always built from scratch: nothing it ships
      # comes out of a cache another run could have written.
      - name: Restore optimizers built from these sources
        id: bin-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            win/resources/bin
            win/resources/svgo.js
          key: optimizers-win-x64-r1-${{ hashFiles('build-windows.ps1', 'advpng/**', 'aom/**', 'gifsicle/**', 'guetzli/**', 'jpegoptim/**', 'libavif/**', 'libjpeg/**', 'libpng/**', 'libwebp/**', 'oxipng/**', 'pngcrush/**', 'pngquant/**', 'svgcleaner/**', 'svgo/**', 'zlib/**', 'zopfli-png/**') }}

      - name: Show what the runner already has
        if: steps.bin-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "MSYS2 at C:\msys64: $(Test-Path 'C:\msys64\usr\bin\bash.exe')"
          Write-Host "processors: $([Environment]::ProcessorCount)"
          foreach ($t in 'cargo', 'rustup', 'node', 'npm', 'cmake') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            Write-Host ("{0,-8} {1}" -f $t, $(if ($c) { $c.Source } else { 'not found' }))
          }

      # A current cargo, so the Rust tools are not left to whatever MSYS2 ships.
      # Off its stable branch the action cannot infer the toolchain from the
      # ref, so it is named.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.bin-cache.outputs.cache-hit != 'true'
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.bin-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      # The AOM AV1 library that avifenc and avifdec link is the biggest single
      # compile here and changes only when aom/ does. build-windows.ps1 reuses a
      # restored prefix only if the stamp inside it matches both aom/ and the
      # script's configure flags, so a cache that has gone stale is rebuilt, not
      # linked. A stale hit is never saved over, though, so r1 is bumped whenever
      # $AomFlags in build-windows.ps1 changes. Restore and save are separate
      # steps so that the library is saved even when some other optimizer fails
      # the build step. Not for a release, as above.
      - name: Restore the AOM library
        id: aom-cache
        if: ${{ steps.bin-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-win/aom-prefix
          key: aom-prefix-win-x64-r1-${{ hashFiles('aom/**') }}

      - name: Build the optimizers
        if: steps.bin-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\build-windows.ps1

      # What the build used, for when an unpinned MSYS2 package changes a result
      - name: Record the toolchain
        if: ${{ !cancelled() && steps.bin-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Q | grep -E "mingw-w64-x86_64-(gcc|cmake|nasm|libpng|zlib|rust)"' 2>&1
          rustc -V
          cargo -V

      - name: Save the AOM library
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && steps.bin-cache.outputs.cache-hit != 'true' && steps.aom-cache.outputs.cache-hit != 'true' && hashFiles('.build-win/aom-prefix/lib/libaom.a') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-win/aom-prefix
          key: aom-prefix-win-x64-r1-${{ hashFiles('aom/**') }}

      # Only a complete build is kept for later runs
      - name: Save the optimizers
        if: ${{ success() && !startsWith(github.ref, 'refs/tags/') && steps.bin-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            win/resources/bin
            win/resources/svgo.js
          key: optimizers-win-x64-r1-${{ hashFiles('build-windows.ps1', 'advpng/**', 'aom/**', 'gifsicle/**', 'guetzli/**', 'jpegoptim/**', 'libavif/**', 'libjpeg/**', 'libpng/**', 'libwebp/**', 'oxipng/**', 'pngcrush/**', 'pngquant/**', 'svgcleaner/**', 'svgo/**', 'zlib/**', 'zopfli-png/**') }}

      # Wanted even on a partial build: the summary says which tools failed, and
      # the app runs with whatever did build.
      # svgo.js is not an executable and so does not live in bin/. Uploading only
      # bin/ left it out of the packaging job, and the resulting app had no SVGO
      # at all - silently, since a missing optimizer is simply skipped.
      - name: Upload the built optimizers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optimizers-win-x64
          path: |
            win/resources/bin/
            win/resources/svgo.js
          if-no-files-found: warn

  package:
    name: Package the app
    runs-on: windows-latest
    needs: optimizers
    if: ${{ !cancelled() }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: win/package-lock.json

      # Electron itself and electron-builder's tools, about 150 MB fetched on
      # every run otherwise
      - name: Restore Electron's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-x64-${{ hashFiles('win/package-lock.json') }}

      # The build script exits non-zero when any single optimizer fails, but the
      # app runs with whatever did build, so packaging should still be attempted.
      - name: Collect the optimizers built in the previous job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: optimizers-win-x64
          path: win/resources/

      - name: Report which optimizers arrived
        shell: pwsh
        run: |
          if (Test-Path win/resources/bin) {
            Get-ChildItem win/resources/bin | ForEach-Object { Write-Host ("  {0,-16} {1:N0} bytes" -f $_.Name, $_.Length) }
          } else {
            Write-Host '  none - packaging an app with no optimizers'
          }
          if (Test-Path win/resources/svgo.js) {
            Write-Host ("  {0,-16} {1:N0} bytes" -f 'svgo.js', (Get-Item win/resources/svgo.js).Length)
          } else {
            throw 'svgo.js did not reach the packaging job; the app would have no SVGO'
          }

      - name: Install dependencies
        working-directory: win
        run: npm ci

      # Only what ships: the packages the installed app loads
      - name: Check the shipped dependencies for known vulnerabilities
        working-directory: win
        run: |
          npm audit --omit=dev
          npm audit signatures

      # The strongest form of the argument tests: the flags are checked against
      # the executables this run just compiled, so a tool that renamed or
      # dropped an option fails the build rather than quietly optimizing
      # nothing.
      - name: Check the optimizers accept their arguments
        working-directory: win
        shell: bash
        run: |
          set -o pipefail
          IMAGEOPTIM_BIN="$GITHUB_WORKSPACE/win/resources/bin" npm test 2>&1 | tee result.txt
          # node --test exits 0 when it matches no files at all, so a glob that
          # silently expanded to nothing used to pass this step with "tests 0".
          # Matched loosely: the counts are prefixed with "#" by the TAP reporter
          # and with a multi-byte character by the spec reporter, and the line
          # endings differ between runners.
          counts=$(tr -d '\r' < result.txt)
          echo "$counts" | grep -qE 'tests [1-9]' \
            || { echo '::error::no tests ran'; exit 1; }
          # A skip here means IMAGEOPTIM_BIN did not resolve, leaving the
          # arguments unverified against the real executables. The one test
          # that needs a packaged build is allowed: there is none yet.
          skipped=$(echo "$counts" | grep -oE 'skipped [0-9]+' | grep -oE '[0-9]+' | tail -1)
          if [ "${skipped:-0}" -gt 1 ]; then
            echo '::error::tests were skipped; the optimizers were not found'
            exit 1
          fi
          rm -f result.txt

      # dist:win passes --publish never. Publishing is the release job's alone:
      # left to itself, electron-builder publishes whenever it sees a tag on CI.
      - name: Build the installer
        working-directory: win
        run: npm run dist:win

      # The two broken releases this port has had - no SVGO, and optimizers
      # that needed DLLs nobody shipped - built and packaged without a hitch.
      # This runs what was packaged: one image of each format must come out
      # smaller and whole, with SVGO from inside app.asar.
      - name: Check the packaged app
        working-directory: win
        shell: pwsh
        run: |
          npx --no-install @electron/fuses read --app dist/win-unpacked/ImageOptim.exe
          $fuses = npx --no-install @electron/fuses read --app dist/win-unpacked/ImageOptim.exe | Out-String
          foreach ($off in 'RunAsNode', 'EnableNodeOptionsEnvironmentVariable', 'EnableNodeCliInspectArguments') {
            if ($fuses -notmatch "$off is Disabled") { throw "$off is not disabled" }
          }
          foreach ($on in 'EnableEmbeddedAsarIntegrityValidation', 'OnlyLoadAppFromAsar') {
            if ($fuses -notmatch "$on is Enabled") { throw "$on is not enabled" }
          }
          $asar = npx --no-install @electron/asar list dist/win-unpacked/resources/app.asar | Out-String
          if ($asar -notmatch 'resources[\\/]svgo\.js') { throw 'svgo.js is not inside app.asar' }
          if (-not (Select-String -Path dist/win-unpacked/resources/app-update.yml -Pattern 'provider: github' -Quiet)) {
            throw 'app-update.yml does not name the GitHub provider'
          }
          node scripts/smoke.mjs dist/win-unpacked/ImageOptim.exe
          if ($LASTEXITCODE -ne 0) { throw 'the packaged app did not optimize its test images' }

      # The installer as users run it: silently, per user, then the same
      # images through the installed copy, then uninstalled again
      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem win/dist/ImageOptim-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ImageOptim'
          $exe = Join-Path $dir 'ImageOptim.exe'
          if (-not (Test-Path $exe)) { throw "the installer did not put ImageOptim.exe in $dir" }
          node win/scripts/smoke.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'the installed app did not optimize its test images' }
          Start-Process (Join-Path $dir 'Uninstall ImageOptim.exe') -ArgumentList '/S' -Wait
          # The uninstaller hands over to a copy of itself and returns at once
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'the uninstaller left ImageOptim.exe behind' }

      # latest.yml and the installer's .blockmap are what the updater reads -
      # the version and checksum, and the block hashes for a differential
      # download.
      - name: Upload the installer and portable zip
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imageoptim-windows
          path: |
            win/dist/*.exe
            win/dist/*.exe.blockmap
            win/dist/*.zip
            win/dist/latest.yml
          if-no-files-found: warn

  # Publishes a version tag as a GitHub Release. Installed copies find it
  # through the releases feed, download the installer named in latest.yml and
  # verify it against the sha512 there (see "Updates" in win/README.md).
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [optimizers, package]
    # The package job also runs after a partial optimizer build, which is fine
    # for an artifact to look at but not for something installed copies pick up
    # by themselves, so a release needs every job to have succeeded.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.optimizers.result == 'success' &&
      needs.package.result == 'success'
    timeout-minutes: 15
    # Whatever is published here reaches every installed copy on its next
    # start. The environment's protection rules - a required reviewer, set in
    # the repository's settings - decide who may let a release through.
    environment: release
    permissions:
      contents: write
      id-token: write      # for the provenance attestation
      attestations: write

    steps:
      - name: Collect the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imageoptim-windows
          path: dist

      - name: Check the files belong to this tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -l dist
          grep -qx "version: $version" dist/latest.yml || {
            echo "::error::latest.yml is not for version $version"; cat dist/latest.yml; exit 1;
          }
          for f in "ImageOptim-Setup-$version.exe" "ImageOptim-Setup-$version.exe.blockmap" "ImageOptim-$version-win.zip"; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          # Every file latest.yml names has to be uploaded under exactly that
          # name, or the updater's download 404s.
          grep -E '^ *(- )?(url|path): ' dist/latest.yml | sed -E 's/^ *(- )?(url|path): //' | sort -u | while read -r name; do
            test -f "dist/$name" || { echo "::error::latest.yml names $name, which was not built"; exit 1; }
          done

      # Checksums anyone can compare a download with, and a signed statement,
      # kept by GitHub, that these exact files came out of this workflow at
      # this commit: `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Write checksums
        shell: bash
        run: |
          cd dist
          sha256sum "ImageOptim-Setup-${GITHUB_REF_NAME#v}.exe" "ImageOptim-${GITHUB_REF_NAME#v}-win.zip" latest.yml > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest where the files came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml

      # GitHub's release API fails now and then on its own: one release took
      # four attempts through an incident, failing with a 502 on publishing and
      # then a 404 uploading to the draft it had just created. So each attempt
      # is retried with a growing pause, and a draft an attempt left behind is
      # completed and published rather than duplicated.
      #
      # A release that is already published is never touched again: replacing
      # its installer would hand installed copies different bytes under the
      # same version. A bad release is fixed with a new version.
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          repo="$GITHUB_REPOSITORY"
          files=(
            "dist/ImageOptim-Setup-$version.exe"
            "dist/ImageOptim-Setup-$version.exe.blockmap"
            "dist/latest.yml"
            "dist/ImageOptim-$version-win.zip"
            "dist/SHA256SUMS.txt"
          )
          if [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2> /dev/null)" = "false" ]; then
            echo "::error::$tag is already published; publish a new version instead"
            exit 1
          fi
          publish() {
            local draft
            if draft=$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2> /dev/null); then
              [ "$draft" = "true" ] || return 0
              # A draft only this workflow has seen: its files can be replaced
              gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber || return 1
              gh release edit "$tag" --repo "$repo" --draft=false || return 1
            else
              gh release create "$tag" "${files[@]}" --repo "$repo" \
                --title "ImageOptim $version" --generate-notes --verify-tag
            fi
          }
          for attempt in 1 2 3 4 5; do
            if publish; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then
              echo "::warning::Publishing failed on attempt $attempt; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::The release could not be published after 5 attempts"
          exit 1
