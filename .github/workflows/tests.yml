# The stubbed suite: no optimizer binaries, a few seconds. Cheap enough to run
# on every push and pull request, unlike the Windows build.
#
# On Windows as well as Linux: the code that handles paths, junctions, case,
# read-only files and hard links behaves differently there, and pull requests
# never ran the Windows build at all.

name: Tests

permissions:
  contents: read

# A newer push supersedes an older run rather than both compiling in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'win/**'
      - '.github/workflows/tests.yml'
  # Every pull request, whatever it touches: these are the checks the main
  # branch's ruleset requires before a merge, and a required check that never
  # runs - a Dependabot update to svgo/ or to windows.yml, say - would leave
  # the pull request waiting for ever. The suite takes seconds.
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      # Actions are pinned to the commit behind their tag, so a moved tag
      # cannot change what runs here; Dependabot proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 24 is what Electron 45 bundles, so the suite runs on the same runtime
      # as the application.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No dependencies are needed: the suite uses node:test and stubs the
      # optimizers, so nothing is spawned and no binaries are required.
      - name: Run the test suite
        working-directory: win
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee result.txt
          tr -d '\r' < result.txt | grep -qE 'tests [1-9]' \
            || { echo '::error::no tests ran'; exit 1; }
          rm -f result.txt
